name: Publish exam site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate bank and exam selection
        run: node scripts/validate_bank.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare static application
        run: |
          mkdir -p _site
          cp index.html styles.css app.js questions-master.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
